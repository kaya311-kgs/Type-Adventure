<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lost Library — Interactive Visual Novel</title>
  <link rel="stylesheet" href="components/style-i.css">
</head>
<body>

<div class="game">

  <!-- Offline CSS Generated Background Scene -->
  <div class="background-scene">
    <div class="ceiling-beam"></div>
    <div class="window-light"></div>
    <div class="table-silhouette"></div>
  </div>
  <div class="overlay"></div>

  <!-- Title-->
<div class="fantasy-display">
  <!-- Glowing Floating Particle Stars -->
  <div class="star star-1"></div>
  <div class="star star-2"></div>
  <div class="star star-3"></div>
  <div class="star star-4"></div>

  <!-- Title Content -->
  <div class="book-title-container">
    <div class="title-line the magic-gold shimmer-effect">THE</div>
    <div class="title-line honorable magic-green shimmer-effect">WIZARD'S</div>
    <div class="title-line con magic-purple shimmer-effect">
    <span class="large-l">LOST </span>
    <span class="large-s">SOCKS</span>
    </div>
  </div>
</div>
  <center><h3 style="color: #e6f2ff; padding-bottom: 80px; text-shadow: 0 0 10px rgba(163, 194, 194, 0.5);">,<b><i>"A humorous fantasy adventure where every decision changes the story. Explore magical locations, solve quirky challenges, collect enchanted items, and recover the Reality Socks to restore order to the wizard's world."</i></b></h3></center>
<!-- Second Title -->
<!-- Inside your central title container -->
<div class="divider-title-container">
  <div class="divider-line the-last">ULTRA</div>
  <div class="divider-line sword">
    <span class="large-letter-s">W</span>ONDERFUL
  </div>
  <div class="divider-line sub-novel">& CHAOTIC EDITION</div>
  
  <!-- ✨ New Fantasy Start Button -->
  <button class="fantasy-start-btn" onclick="window.location.href='home.html'">START</button>
</div>

  <!-- Footer Version Bar -->
  <footer class="footer">
    <span class="version">v1.0.0-KGS</span>
  </footer>

</div>
</body>
</html>
